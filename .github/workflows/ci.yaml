name: CI
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - '**.md'
      - docs/**
      - .github/**
      - .gitignore
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - docs/**
      - .github/**

# Cancel in-progress runs when a new commit is pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

  test:
    name: Test
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    # DB-backed tests (migrations, store) skip without TEST_DATABASE_URL, so
    # CI provides a real Postgres rather than letting them silently skip.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: relayer
          POSTGRES_PASSWORD: relayer
          POSTGRES_DB: relayer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relayer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://relayer:relayer@localhost:5432/relayer_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

  vet:
    name: Vet
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

  # Gate job — all required jobs must pass for the PR to be mergeable.
  # Add this as the required status check in branch protection settings.
  ci:
    name: CI
    if: ${{ always() }}
    needs:
      - build
      - test
      - vet
    runs-on: ubuntu-latest
    steps:
      - name: Failed
        run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
