version: 2
updates:
  # GitHub Actions — group all into one PR per month
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-deps:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(deps): '

  # Go modules — monthly, no major version bumps (those need human review)
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: 'chore(deps): '
    labels:
      - dependencies
