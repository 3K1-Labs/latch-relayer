services:
  relayer:
    build: .
    ports:
      - "${PORT:-4000}:4000"
    env_file: .env
    environment:
      # Override DATABASE_URL to point at the compose postgres service
      DATABASE_URL: postgres://latch:latch@postgres:5432/latch_relayer?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure:3
    security_opt:
      - no-new-privileges

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: latch
      POSTGRES_PASSWORD: latch
      POSTGRES_DB: latch_relayer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U latch -d latch_relayer"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: on-failure:3
    security_opt:
      - no-new-privileges

volumes:
  postgres_data:
