minimum_pre_commit_version: 3.5.0
default_install_hook_types:
  - commit-msg
  - pre-commit
default_stages:
  - pre-commit

repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-json
      - id: check-case-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer

  # Enforce conventional commit message format on every commit
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages:
          - commit-msg
        args:
          - --strict
          - build
          - chore
          - ci
          - docs
          - feat
          - fix
          - perf
          - refactor
          - revert
          - style
          - test

  # Go — format and vet before every commit
  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: bash -c 'bad=$(gofmt -l "$@"); [ -n "$bad" ] && { echo "Run gofmt on:"; echo "$bad"; exit 1; } || exit 0'
        language: system
        types:
          - go
        pass_filenames: true
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types:
          - go
        pass_filenames: false
